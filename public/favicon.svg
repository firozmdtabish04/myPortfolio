<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="tfGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="64" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#tfGrad)"/>
  
  <!-- Subtle Glass Highlight -->
  <rect x="3" y="3" width="58" height="27" rx="14" fill="url(#shine)"/>
  
  <!-- Inner Border Stroke -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" stroke="rgba(255,255,255,0.25)" stroke-width="1.2"/>

  <!-- Stylized "T" Character -->
  <!-- Top Crossbar (Centered at X=32) -->
  <rect x="15" y="16" width="34" height="8" rx="4" fill="#ffffff" filter="url(#shadow)"/>
  
  <!-- Vertical Stem (Centered at X=32) -->
  <rect x="28" y="21" width="8" height="27" rx="4" fill="#ffffff" filter="url(#shadow)"/>

  <!-- Status / Brand Accent Beacon -->
  <circle cx="48" cy="17" r="4" fill="#10b981"/>
  <circle cx="48" cy="17" r="2" fill="#d1fae5"/>
</svg>
